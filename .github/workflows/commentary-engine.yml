name: commentary-engine-quality

on:
  push:
    paths:
      - "commentary_engine/**"
      - ".github/workflows/commentary-engine.yml"
  pull_request:
    paths:
      - "commentary_engine/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r commentary_engine/requirements.txt
      - run: python -m compileall commentary_engine
      - run: python -m unittest discover -s commentary_engine/tests -v
